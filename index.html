<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Таймер">
  
  <title>Интервальный таймер</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
  <!-- Табло -->
  <section class="display" id="display" aria-live="polite">
    <div class="status" id="statusText">ГОТОВ К СТАРТУ</div>
    <div class="time" id="timeText">03:00</div>
    <div class="round-info" id="roundText">Раунд: 1 / 3</div>
  </section>

  <!-- Управление -->
  <section class="controls">
    <button type="button" class="btn btn-start" id="startBtn">Старт</button>
    <button type="button" class="btn btn-reset" id="resetBtn">Сброс</button>
  </section>

  <!-- Быстрые пресеты -->
  <section class="presets" id="presetsContainer">
    <button type="button" class="btn btn-preset" data-rounds="3" data-work="180" data-rest="60" data-sound="gong">
      🥊 Бокс (3×3 мин / 1 мин)
    </button>
    <button type="button" class="btn btn-preset" data-rounds="5" data-work="30" data-rest="60" data-sound="whistle">
      ⏱ 5 подходов (30с / 1 мин)
    </button>
    <button type="button" class="btn btn-preset" data-rounds="8" data-work="20" data-rest="10" data-sound="beep">
      🔥 Табата (8×20с / 10с)
    </button>
    <button type="button" class="btn btn-preset" id="testSoundBtn">
      🔊 Проверка звука
    </button>
  </section>

  <!-- Настройки -->
  <section class="settings" id="settingsForm">
    <h2>Настройки тренировки</h2>
    
    <div class="row">
      <label for="roundsInput">Количество раундов / подходов</label>
      <input type="number" id="roundsInput" value="3" min="1" max="99">
    </div>

    <div class="row">
      <label>Работа (мин : сек)</label>
      <div class="time-inputs">
        <input type="number" id="workMin" value="3" min="0" max="59" aria-label="Минуты работы">
        <span>:</span>
        <input type="number" id="workSec" value="0" min="0" max="59" aria-label="Секунды работы">
      </div>
    </div>

    <div class="row">
      <label>Отдых (мин : сек)</label>
      <div class="time-inputs">
        <input type="number" id="restMin" value="1" min="0" max="59" aria-label="Минуты отдыха">
        <span>:</span>
        <input type="number" id="restSec" value="0" min="0" max="59" aria-label="Секунды отдыха">
      </div>
    </div>

    <div class="row">
      <label for="prepSec">Подготовка перед стартом (сек)</label>
      <input type="number" id="prepSec" value="5" min="0" max="60">
    </div>

    <div class="row">
      <label for="soundType">Звук сигнала</label>
      <select id="soundType">
        <option value="gong">Боксёрский гонг</option>
        <option value="whistle">Свисток тренера</option>
        <option value="beep">Электронный сигнал</option>
      </select>
    </div>

    <div class="row">
      <label for="warnCheck">Сигнал за 10 сек до конца раунда</label>
      <input type="checkbox" id="warnCheck" checked>
    </div>

    <div class="row">
      <label for="tickCheck">Тиканье секунд во время работы</label>
      <input type="checkbox" id="tickCheck" checked>
    </div>
  </section>
</main>

<script src="app.js" defer></script>
</body>
</html>
