<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Таймер">
  
  <title>Спортивный таймер и планер</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
  <!-- Навигация по вкладкам -->
  <nav class="tabs" id="mainTabs">
    <button type="button" class="tab-btn active" data-tab="timer">⏱ Таймер</button>
    <button type="button" class="tab-btn" data-tab="builder">📋 Программы</button>
    <button type="button" class="tab-btn" data-tab="schedule">📅 График</button>
  </nav>

  <!-- ==================== ВКЛАДКА 1: ТАЙМЕР ==================== -->
  <div class="tab-content active" id="tab-timer">
    <!-- Баннер тренировки на сегодня -->
    <div class="today-banner" id="todayBanner" style="flex-direction: column; align-items: stretch;">
      <span class="today-label">Сегодня по плану</span>
      <div id="todayWorkoutsList" style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px;"></div>
    </div>

    <!-- Табло -->
    <section class="display" id="display" aria-live="polite">
      <div class="exercise-title" id="exerciseTitle">Свободный режим</div>
      <div class="status" id="statusText">ГОТОВ К СТАРТУ</div>
      <div class="time" id="timeText">03:00</div>
      <div class="round-info" id="roundText">Подход: 1 / 3</div>
      <div class="next-info" id="nextText"></div>
    </section>

    <!-- Управление -->
    <section class="controls">
      <button type="button" class="btn btn-start" id="startBtn">Старт</button>
      <button type="button" class="btn btn-reset" id="resetBtn">Сброс</button>
    </section>

    <!-- Быстрые пресеты (для свободного режима) -->
    <section class="presets" id="presetsContainer">
      <button type="button" class="btn btn-preset" data-rounds="3" data-work="180" data-rest="60" data-sound="gong">
        🥊 Бокс (3×3м / 1м)
      </button>
      <button type="button" class="btn btn-preset" data-rounds="5" data-work="30" data-rest="60" data-sound="whistle">
        ⏱ 5×30с / 1м
      </button>
      <button type="button" class="btn btn-preset" data-rounds="8" data-work="20" data-rest="10" data-sound="beep">
        🔥 Табата (8×20с/10с)
      </button>
      <button type="button" class="btn btn-preset" id="testSoundBtn">
        🔊 Тест звука
      </button>
    </section>

    <!-- Ручные настройки (скрываются, если загружена программа) -->
    <section class="settings" id="quickSettings">
      <div class="settings-header">
        <h2>Быстрая настройка</h2>
      </div>
      <div class="row">
        <label for="roundsInput">Подходов</label>
        <input type="number" id="roundsInput" value="3" min="1" max="99">
      </div>
      <div class="row">
        <label>Работа (мин : сек)</label>
        <div class="time-inputs">
          <input type="number" id="workMin" value="3" min="0" max="59">
          <span>:</span>
          <input type="number" id="workSec" value="0" min="0" max="59">
        </div>
      </div>
      <div class="row">
        <label>Отдых (мин : сек)</label>
        <div class="time-inputs">
          <input type="number" id="restMin" value="1" min="0" max="59">
          <span>:</span>
          <input type="number" id="restSec" value="0" min="0" max="59">
        </div>
      </div>
    </section>

    <!-- Глобальные настройки звука -->
    <section class="settings" id="soundSettings">
      <h2>Звук и оповещения</h2>
      <div class="row">
        <label for="prepSec">Подготовка перед стартом (сек)</label>
        <input type="number" id="prepSec" value="5" min="0" max="60">
      </div>
      <div class="row">
        <label for="soundType">Основной сигнал</label>
        <select id="soundType">
          <option value="gong">Боксёрский гонг</option>
          <option value="whistle">Свисток тренера</option>
          <option value="beep">Электронный сигнал</option>
        </select>
      </div>
      <div class="row">
        <label for="voiceCheck">Голосовой помощник (названия)</label>
        <input type="checkbox" id="voiceCheck" checked>
      </div>
      <div class="row">
        <label for="warnCheck">Сигнал за 10 сек до конца</label>
        <input type="checkbox" id="warnCheck" checked>
      </div>
      <div class="row">
        <label for="tickCheck">Тиканье секунд в работе</label>
        <input type="checkbox" id="tickCheck" checked>
      </div>
    </section>
  </div>

  <!-- ==================== ВКЛАДКА 2: ПРОГРАММЫ ==================== -->
  <div class="tab-content" id="tab-builder">
    <!-- Список сохранённых тренировок -->
    <section class="settings">
      <h2>Мои тренировки</h2>
      <div id="savedWorkoutsList" class="workout-list"></div>
    </section>

    <!-- Конструктор новой тренировки -->
    <section class="settings">
      <h2>Создать программу</h2>
      <div class="row">
        <input type="text" id="workoutNameInput" class="full-input" placeholder="Название (напр. День 1: Турник и брусья)">
      </div>

      <!-- Добавление шага -->
      <div class="step-adder">
        <div class="row">
          <label for="exerciseSelect">Упражнение</label>
          <select id="exerciseSelect"></select>
        </div>
        
        <div class="row" id="customExRow" hidden>
          <input type="text" id="customExInput" class="full-input" placeholder="Введите своё упражнение...">
        </div>

        <div class="grid-3">
          <div>
            <small>Подходы</small>
            <input type="number" id="stepSets" value="3" min="1" max="50">
          </div>
          <div>
            <small>Работа (сек)</small>
            <input type="number" id="stepWork" value="30" min="5" max="3600">
          </div>
          <div>
            <small>Отдых (сек)</small>
            <input type="number" id="stepRest" value="40" min="0" max="600">
          </div>
        </div>

        <div class="row">
          <label for="stepAfterRest">Отдых после упражнения (сек)</label>
          <input type="number" id="stepAfterRest" value="60" min="0" max="600">
        </div>

        <button type="button" class="btn btn-preset full-btn" id="addStepBtn">+ Добавить шаг в программу</button>
      </div>

      <!-- Черновик шагов -->
      <div id="draftStepsList" class="draft-list"></div>

      <button type="button" class="btn btn-start full-btn" id="saveWorkoutBtn">💾 Сохранить тренировку</button>
    </section>
  </div>

  <!-- ==================== ВКЛАДКА 3: ГРАФИК ==================== -->
<div id="tab-schedule" class="tab-content">
  <div class="settings">
    <h2>График тренировок</h2>

    <div class="row">
      <label for="scheduleMode">Режим графика</label>
      <select id="scheduleMode">
        <option value="weekly">По дням недели</option>
        <option value="cycle">Скользящий цикл</option>
      </select>
    </div>

    <div class="row">
      <label for="remindBefore">Напомнить за (мин)</label>
      <input type="number" id="remindBefore" value="30" min="0" max="1440">
    </div>

    <!-- Настройки по дням недели -->
    <div id="weeklySettings" class="schedule-block"></div>

    <!-- Настройки скользящего цикла -->
    <div id="cycleSettings" class="schedule-block" hidden>
      <div class="row">
        <label for="cycleGap">Интервал (раз в N дней)</label>
        <input type="number" id="cycleGap" value="2" min="1" max="30">
      </div>
      <div class="row">
        <label for="cycleStart">Дата старта цикла</label>
        <input type="date" id="cycleStart">
      </div>

      <div class="step-adder">
        <small style="color:#aaa">Добавить слот в цикл (укажите день цикла, время и программу):</small>
        <div class="row">
          <select id="cycleDaySlot" style="width: 90px;">
            <option value="0">День 1</option>
            <option value="1">День 2</option>
            <option value="2">День 3</option>
            <option value="3">День 4</option>
            <option value="4">День 5</option>
            <option value="5">День 6</option>
            <option value="6">День 7</option>
          </select>
          <input type="time" id="cycleTimeInput" value="19:00">
          <select id="cycleAddSelect"></select>
        </div>
        <button type="button" id="cycleAddBtn" class="btn btn-preset full-btn">+ Добавить в цикл</button>
      </div>

      <div id="cycleWorkoutsList" class="workout-list"></div>
    </div>

    <button type="button" id="saveScheduleBtn" class="btn btn-accent full-btn">Сохранить график</button>
    <button type="button" id="addToCalendarBtn" class="btn btn-preset full-btn">📅 Добавить в календарь телефона</button>
  </div>
</div>

</main>

<script type="module" src="./js/main.js"></script>
</body>
</html>
